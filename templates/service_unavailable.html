<!doctype html>
<html lang="de">
<head>

  <script src="{{ url_for('static', filename='theme.js') }}"></script>
  <style>
    body { margin: 0; padding: 2rem; background: #f5f7fa; color: #182437; font: 1rem/1.6 system-ui, sans-serif; }

    h1 { font-size: 1.5rem; line-height: 1.3; }

    [data-bs-theme="dark"] { color-scheme: dark; }

    [data-bs-theme="dark"] main { background: #1b2228; }

  <main>
    <h1>PresseRadar ist vorübergehend nicht erreichbar</h1>
