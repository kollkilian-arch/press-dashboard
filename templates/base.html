<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Marktintelligenz{% endblock %} – News Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">
      <i class="bi bi-newspaper me-1"></i>Marktintelligenz
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}"
             href="{{ url_for('dashboard') }}">
            <i class="bi bi-house me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'quellen' %}active{% endif %}"
             href="{{ url_for('quellen') }}">
            <i class="bi bi-rss me-1"></i>Quellen
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint in ('bericht','bericht_erstellen') %}active{% endif %}"
             href="{{ url_for('bericht') }}">
            <i class="bi bi-stars me-1"></i>Tagesbericht
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'einstellungen' %}active{% endif %}"
             href="{{ url_for('einstellungen') }}">
            <i class="bi bi-gear me-1"></i>Einstellungen
          </a>
        </li>
      </ul>
      <div class="d-flex gap-2">
        <form method="post" action="{{ url_for('api_fetch_all') }}">
          <button class="btn btn-outline-light btn-sm" type="submit">
            <i class="bi bi-arrow-clockwise me-1"></i>Aktualisieren
          </button>
        </form>
        <div class="dropdown">
          <button class="btn btn-outline-light btn-sm dropdown-toggle" data-bs-toggle="dropdown">
            <i class="bi bi-file-pdf me-1"></i>PDF-Export
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="{{ url_for('export_pdf', tage=1) }}">Heute (1 Tag)</a></li>
            <li><a class="dropdown-item" href="{{ url_for('export_pdf', tage=7) }}">Letzte 7 Tage</a></li>
            <li><a class="dropdown-item" href="{{ url_for('export_pdf', tage=30) }}">Letzter Monat</a></li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>

<div class="container-fluid py-3 px-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}
      <div class="alert alert-{{ cat }} alert-dismissible fade show py-2" role="alert">
        {{ msg }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
